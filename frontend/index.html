<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Gestão de Colaboradores</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container mt-4">

  <h1 class="mb-3">Gestão de Colaboradores</h1>

  <button class="btn btn-primary mb-3" onclick="carregarColaboradores()">
    Carregar colaboradores
  </button>

  <!-- TABELA -->
  <table class="table table-bordered table-striped">
    <thead class="table-dark">
      <tr>
        <th>Nome</th>
        <th>RE</th>
        <th>Cargo</th>
        <th>Empresa</th>
        <th>Salário Atual</th>
        <th>Salário Anterior</th>
        <th>Status</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="tabela-colaboradores"></tbody>
  </table>

  <hr>

  <!-- CADASTRO -->
  <h4>Cadastrar colaborador</h4>
  <input class="form-control mb-2" id="nome" placeholder="Nome completo">
  <input class="form-control mb-2" id="re" placeholder="RE">
  <input class="form-control mb-2" id="cargo" placeholder="Cargo">
  <input class="form-control mb-2" id="empresa" placeholder="Empresa">
  <input class="form-control mb-2" id="salario" type="number" placeholder="Salário atual">

  <button class="btn btn-success" onclick="cadastrarColaborador()">Cadastrar</button>

  <hr>

  <!-- REAJUSTE -->
  <h4>Reajuste salarial</h4>
  <input class="form-control mb-2" id="idReajuste" placeholder="ID do colaborador">
  <input class="form-control mb-2" id="percentual" placeholder="Percentual (%)">
  <input class="form-control mb-2" id="bonus" placeholder="Bônus (opcional)">
  <button class="btn btn-warning" onclick="reajustarSalario()">Aplicar reajuste</button>

</div>

<!-- MODAL EDITAR COLABORADOR -->
<div class="modal fade" id="modalEditar" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Editar colaborador</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <input type="hidden" id="editId">

        <div class="mb-2">
          <label>Nome completo</label>
          <input id="editNome" class="form-control">
        </div>

        <div class="mb-2">
          <label>RE</label>
          <input id="editRe" class="form-control">
        </div>

        <div class="mb-2">
          <label>Cargo</label>
          <input id="editCargo" class="form-control">
        </div>

        <div class="mb-2">
          <label>Empresa</label>
          <input id="editEmpresa" class="form-control">
        </div>

        <div class="mb-2">
          <label>Salário atual</label>
          <input id="editSalario" type="number" class="form-control">
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">
          Cancelar
        </button>
        <button class="btn btn-success" onclick="salvarEdicao()">
          Salvar alterações
        </button>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
